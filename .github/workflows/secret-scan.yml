name: secret-scan

# Fail the build if a credential is committed. The P0 JWT incident (a hardcoded
# signing secret sitting in a PUBLIC repo for months) would have been caught by
# this gate on the day it was written.
#
# Two scans, with different purposes:
#
#   1. GATE — scans only the commits this push introduced. A new secret fails
#      the build. This is the one that protects going forward.
#   2. AUDIT — scans the full history and uploads the report as an artifact,
#      but does NOT fail the build. The repo still contains the old leaked
#      literal in history; if the audit scan gated the build, it would block
#      the very push that removes the secret, and the repo would be stuck
#      unfixable. The audit report tells us what still needs purging.
#
# Note: this workflow only takes effect once it is pushed to GitHub. Until a
# working credential exists, run the same scans locally:
#   gitleaks detect --source=. --redact
#
# Requires no repo secrets — the scan is fully local to the checkout.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the incident was a secret committed long ago, and a
          # shallow clone would hide it.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      # ---------------------------------------------------------------------
      # GATE: only the newly introduced commits. A secret introduced by this
      # push fails the build.
      # ---------------------------------------------------------------------
      - name: Scan newly introduced commits (gate)
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # A force-push or a first push has no usable "before" range; fall
          # back to scanning just the tip commit so we still gate on it.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
             [ -z "$BEFORE" ]; then
            RANGE="$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "Scanning commit range: $RANGE"
          gitleaks detect \
            --source=. \
            --log-opts="$RANGE" \
            --redact \
            --report-format json \
            --report-path=gitleaks-new-report.json

      # ---------------------------------------------------------------------
      # AUDIT: full history, informational only. Uploads the report so the
      # remaining legacy leaks stay visible without blocking a fix.
      # ---------------------------------------------------------------------
      - name: Scan full history (audit, non-blocking)
        continue-on-error: true
        run: |
          gitleaks detect \
            --source=. \
            --redact \
            --report-format json \
            --report-path=gitleaks-history-report.json

      - name: Scan working tree (untracked files)
        if: always()
        continue-on-error: true
        run: |
          gitleaks detect \
            --source=. \
            --no-git \
            --redact \
            --report-format json \
            --report-path=gitleaks-worktree-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-*.json
          if-no-files-found: ignore
