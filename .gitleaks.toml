# Custom gitleaks rules for MotoTrackIQ backend.
#
# Why this file exists: the default gitleaks ruleset did NOT flag the exact
# line that caused the P0 incident:
#
#   const JWT_SECRET = process.env.JWT_SECRET || '<REDACTED-JWT-LITERAL>';
#
# Verified by test: a repo containing only that line produced 0 leaks under
# the default rules, and the full-history scan of this repo also reported 0
# while the literal was demonstrably present in history. A scanner that does
# not catch the known bad pattern is not a gate.
#
# The rules below target the two shapes that actually caused the incident:
#   1. a hardcoded fallback secret assigned to a secret-ish env var
#   2. the known leaked literal itself, anywhere in the tree

title = "MotoTrackIQ backend gitleaks config"

[extend]
# Use the default ruleset AND our custom rules.
useDefault = true

[[rules]]
id = "hardcoded-env-secret-fallback"
description = "Hardcoded fallback assigned to a secret env var (e.g. JWT_SECRET = process.env.JWT_SECRET || 'literal')"
regex = '''(?i)(JWT_SECRET|ADMIN_KEY|SECRET|PASSWORD|API_KEY|TOKEN)\s*[:=]{1,2}\s*[^;\n]{0,40}process\.env\.[A-Z_]+\s*\|\|\s*['"][^'"]{8,}['"]'''
keywords = ["process.env"]
secretGroup = 0

[[rules]]
id = "known-leaked-jwt-literal"
description = "The MotoTrackIQ JWT secret literal that was committed to the public repo"
regex = '''<REDACTED-JWT-LITERAL>'''
keywords = ["<REDACTED-JWT-LITERAL>"]
secretGroup = 0

[[rules]]
id = "generic-hardcoded-secret-assignment"
description = "A secret-ish variable assigned a long quoted literal instead of reading the environment"
regex = '''(?i)\b(JWT_SECRET|ADMIN_KEY|SECRET_KEY|API_SECRET|DB_PASSWORD|REPORT_LINK_SECRET)\s*=\s*['"][A-Za-z0-9/+_.-]{16,}['"]'''
keywords = ["secret", "password", "token"]
secretGroup = 0

[allowlist]
# Local-only secret material must never be committed, but these paths exist
# locally and are gitignored; the worktree scan would otherwise flag them.
paths = [
  '''\.env$''',
  '''\.env\.bak\..*''',
  '''config/credentials\.json''',
  '''config/token\.json''',
  '''node_modules/''',
  '''\.gitleaks\.toml''',
]
